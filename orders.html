<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة الطلبات | Yellow Rose</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #ffd700;
      --gold-light: #ffe566;
      --dark: #111111;
      --dark2: #1a1a1a;
      --dark3: #222222;
      --card-bg: #ffffff;
      --border: #e8e8e8;
      --text: #1a1a1a;
      --text-muted: #666;
      --green: #22c55e;
      --blue: #3b82f6;
      --orange: #f97316;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: #f4f5f7;
      min-height: 100vh;
      color: var(--text);
    }

    /* ===================== LOGIN OVERLAY ===================== */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #111 0%, #1a1a1a 50%, #0d0d0d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .login-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .login-logo {
      font-size: 3rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .login-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: white;
      margin-bottom: 0.25rem;
    }
    .login-sub {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .login-input {
      width: 100%;
      padding: 1rem 1.25rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 10px;
      color: white;
      font-family: inherit;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      margin-bottom: 1.25rem;
      transition: border-color 0.3s;
    }
    .login-input:focus { border-color: var(--gold); }
    .login-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--gold), #e6c200);
      color: var(--dark);
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .login-error {
      margin-top: 1rem;
      color: #ff6b6b;
      font-size: 0.9rem;
      display: none;
    }

    /* ===================== TOPBAR ===================== */
    .topbar {
      background: var(--dark);
      color: var(--gold);
      padding: 0 2rem;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.2rem;
    }
    .topbar-brand i { font-size: 1.4rem; }
    .topbar-actions { display: flex; align-items: center; gap: 1rem; }
    .topbar-link {
      color: rgba(255,215,0,0.7);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .topbar-link:hover { color: var(--gold); }
    .logout-btn {
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 8px;
      background: transparent;
      color: var(--gold);
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logout-btn:hover { background: rgba(255,215,0,0.1); }

    /* ===================== MAIN ===================== */
    .main { padding: 2rem; max-width: 1400px; margin: 0 auto; }

    /* ===================== STATS ===================== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border-right: 4px solid transparent;
    }
    .stat-card.gold { border-right-color: var(--gold); }
    .stat-card.green { border-right-color: var(--green); }
    .stat-card.blue { border-right-color: var(--blue); }
    .stat-card.orange { border-right-color: var(--orange); }
    .stat-icon {
      width: 46px; height: 46px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .stat-icon.gold { background: #fff9cc; color: #b8860b; }
    .stat-icon.green { background: #dcfce7; color: #16a34a; }
    .stat-icon.blue { background: #dbeafe; color: #2563eb; }
    .stat-icon.orange { background: #ffedd5; color: #ea580c; }
    .stat-val { font-size: 1.8rem; font-weight: 800; line-height: 1; }
    .stat-lbl { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }

    /* ===================== CONTROLS ===================== */
    .controls {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      flex-wrap: wrap;
    }
    .ctrl-group {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .ctrl-group i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .ctrl-input, .ctrl-select {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }
    .ctrl-input:focus, .ctrl-select:focus { border-color: var(--gold); }
    .ctrl-btn {
      padding: 0.75rem 1.5rem;
      background: var(--dark);
      color: var(--gold);
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .ctrl-btn:hover { opacity: 0.85; }

    /* ===================== ORDERS GRID ===================== */
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.25rem;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }
    .empty-state i { font-size: 3.5rem; opacity: 0.3; margin-bottom: 1rem; display: block; }
    .empty-state p { font-size: 1.1rem; }

    /* ===================== ORDER CARD ===================== */
    .order-card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .order-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

    .card-header {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #fafafa, #f0f0f0);
    }
    .order-id { font-size: 1.15rem; font-weight: 800; color: var(--dark); }
    .order-date { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }

    .status-badge {
      padding: 0.3rem 0.8rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-pending   { background: #fef9c3; color: #854d0e; }
    .badge-preparing { background: #dbeafe; color: #1e40af; }
    .badge-ready     { background: #dcfce7; color: #15803d; }
    .badge-completed { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

    .card-body {
      padding: 1.25rem;
      flex: 1;
    }
    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 0.7rem;
      font-size: 0.92rem;
      color: var(--text);
    }
    .info-row i {
      width: 18px;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .info-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      min-width: 80px;
    }
    .info-value { font-weight: 500; word-break: break-all; }

    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 0.75rem; }
    .tag {
      padding: 0.25rem 0.7rem;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .tag-gift { background: #fdf2f8; color: #9d174d; border: 1px solid #fbcfe8; }
    .tag-print { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .tag-delivery { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

    .card-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      background: #fafafa;
    }
    .action-btn {
      flex: 1;
      min-width: 100px;
      padding: 0.65rem 0.75rem;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .action-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-dark { background: var(--dark); color: var(--gold); }
    .btn-green { background: #22c55e; color: white; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-gold { background: var(--gold); color: var(--dark); }

    .status-select {
      flex: 2;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.88rem;
      background: white;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    .status-select:focus { border-color: var(--gold); }

    /* Loader */
    .spinner { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--dark);
      color: var(--gold);
      padding: 0.85rem 1.75rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- ===== LOGIN OVERLAY ===== -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="login-logo"><i class="fas fa-store"></i></div>
      <h1 class="login-title">إدارة الطلبات</h1>
      <p class="login-sub">Yellow Rose • Sales Orders</p>
      <form id="loginForm">
        <input
          type="password"
          id="pinInput"
          class="login-input"
          placeholder="أدخل رمز الدخول"
          autocomplete="off"
          required
        >
        <button type="submit" class="login-btn">
          <i class="fas fa-unlock-alt"></i> دخول
        </button>
        <p class="login-error" id="loginError">رمز الدخول غير صحيح.</p>
      </form>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div id="mainContent" style="display:none;">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-brand">
        <i class="fas fa-clipboard-list"></i>
        <span>لوحة إدارة الطلبات</span>
      </div>
      <div class="topbar-actions">
        <a href="/admin.html" class="topbar-link">
          <i class="fas fa-cog"></i> لوحة الإدارة
        </a>
        <a href="/print-station.html" class="topbar-link">
          <i class="fas fa-print"></i> محطة الطباعة
        </a>
        <button class="logout-btn" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i> خروج
        </button>
      </div>
    </header>

    <!-- Main -->
    <main class="main">

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card gold">
          <div class="stat-icon gold"><i class="fas fa-shopping-bag"></i></div>
          <div>
            <div class="stat-val" id="statTotal">0</div>
            <div class="stat-lbl">إجمالي الطلبات</div>
          </div>
        </div>
        <div class="stat-card orange">
          <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
          <div>
            <div class="stat-val" id="statPending">0</div>
            <div class="stat-lbl">قيد الانتظار</div>
          </div>
        </div>
        <div class="stat-card blue">
          <div class="stat-icon blue"><i class="fas fa-cog"></i></div>
          <div>
            <div class="stat-val" id="statPreparing">0</div>
            <div class="stat-lbl">جاري التجهيز</div>
          </div>
        </div>
        <div class="stat-card green">
          <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
          <div>
            <div class="stat-val" id="statReady">0</div>
            <div class="stat-lbl">جاهز للاستلام</div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="ctrl-group">
          <i class="fas fa-search"></i>
          <input type="text" id="searchOrder" class="ctrl-input" placeholder="ابحث برقم الطلب أو اسم العميل...">
        </div>
        <div class="ctrl-group" style="flex: 0 0 200px; min-width: 160px;">
          <i class="fas fa-filter"></i>
          <select id="statusFilter" class="ctrl-select">
            <option value="all">جميع الحالات</option>
            <option value="pending">قيد الانتظار</option>
            <option value="preparing">جاري التجهيز</option>
            <option value="ready">جاهز للاستلام</option>
            <option value="completed">مكتمل</option>
          </select>
        </div>
        <button class="ctrl-btn" onclick="fetchOrders()">
          <i class="fas fa-sync-alt" id="refreshIcon"></i> تحديث
        </button>
      </div>

      <!-- Orders Grid -->
      <div class="orders-grid" id="ordersGrid">
        <div class="empty-state">
          <i class="fas fa-spinner spinner"></i>
          <p>جاري تحميل الطلبات...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/assets/js/orders.js"></script>
</body>
</html>
